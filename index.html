<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corrida Espacial</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#07051a;color:#bffcff;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column}
#c{flex:1;min-height:0;width:100%;display:block}
#pad{height:172px;display:flex;justify-content:center;align-items:center;background:#0a0828;border-top:2px solid #ff3df2}
#dp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:150px;height:150px;touch-action:none}
#dp div{background:#14103a;border:2px solid #3a2f8f;display:flex;align-items:center;justify-content:center;font-size:20px;color:#7d6cff}
#dp div.on{background:#1b5d70;color:#fff;border-color:#3fe0ff}
#dp #fire{font-size:11px;font-weight:bold;color:#ff9ef8;border-color:#ff3df2;background:linear-gradient(to top,#ff3df2 calc(var(--cd,0)*100%),#14103a 0)}
#dp #fire.on{color:#fff}
</style></head><body>
<canvas id="c"></canvas>
<div id="pad"><div id="dp">
<div data-x="-1" data-y="-1">↖</div><div data-x="0" data-y="-1">↑</div><div data-x="1" data-y="-1">↗</div>
<div data-x="-1" data-y="0">←</div><div id="fire" data-x="0" data-y="0">FIRE</div><div data-x="1" data-y="0">→</div>
<div data-x="-1" data-y="1">↙</div><div data-x="0" data-y="1">↓</div><div data-x="1" data-y="1">↘</div>
</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),lo=document.createElement('canvas'),lc=lo.getContext('2d');
const S=3;let W,H;
function rs(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);lo.width=Math.ceil(W/S);lo.height=Math.ceil(H/S);lc.setTransform(1/S,0,0,1/S,0,0)}
addEventListener('resize',rs);rs();

let pd={x:0,y:0},fireHeld=false;const keys={};
const dp=document.getElementById('dp'),fireEl=document.getElementById('fire'),cells=[...dp.children];
function hl(){const d=dir();cells.forEach(c=>c.classList.toggle('on',(d.x||d.y)?(+c.dataset.x===d.x&&+c.dataset.y===d.y):(c===fireEl&&(fireHeld||keys[' ']))))}
function dir(){let x=0,y=0;
 if(keys.ArrowLeft||keys.a)x--;if(keys.ArrowRight||keys.d)x++;
 if(keys.ArrowUp||keys.w)y--;if(keys.ArrowDown||keys.s)y++;
 return(x||y)?{x,y}:pd}
function setPad(e){const r=dp.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
 if(Math.abs(x)<r.width/6&&Math.abs(y)<r.height/6){pd={x:0,y:0};fireHeld=true}
 else{fireHeld=false;const a=Math.round(Math.atan2(y,x)/(Math.PI/4))*Math.PI/4;pd={x:Math.round(Math.cos(a)),y:Math.round(Math.sin(a))}}hl()}
let down=false;
dp.addEventListener('pointerdown',e=>{down=true;dp.setPointerCapture(e.pointerId);setPad(e);start()});
dp.addEventListener('pointermove',e=>{if(down)setPad(e)});
['pointerup','pointercancel'].forEach(t=>dp.addEventListener(t,()=>{down=false;pd={x:0,y:0};fireHeld=false;hl()}));
cv.addEventListener('pointerdown',start);
const K=e=>e.key.length>1?e.key:e.key.toLowerCase();
addEventListener('keydown',e=>{const k=K(e);if(k.startsWith('Arrow')||k===' ')e.preventDefault();
 keys[k]=true;hl();if(k===' '||k==='Enter'||k.startsWith('Arrow'))start()});
addEventListener('keyup',e=>{keys[K(e)]=false;hl()});

let ship,ast,bul,par,stars,speed,score,best=0,state='ready',spawnT,fireT,dist=0,overT=0,last=performance.now();
const CD=.3;
try{best=+localStorage.getItem('best')||0}catch(e){}
const R=(a,b)=>a+Math.random()*(b-a);
stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),z:R(.2,1)}));
function reset(){ship={x:W/2,y:H*.78,r:10};ast=[];bul=[];par=[];speed=220;score=0;spawnT=.5;fireT=0}
function start(){if(state==='play')return;if(state==='over'&&performance.now()-overT<600)return;reset();state='play'}
function spawn(){const r=R(16,40),n=10,pts=[];
 for(let i=0;i<n;i++)pts.push([Math.cos(i/n*6.283)*r*R(.75,1.1),Math.sin(i/n*6.283)*r*R(.75,1.1)]);
 ast.push({x:R(0,W),y:-60,r,vy:speed*R(.9,1.2),vx:R(-40,40),a:0,va:R(-2,2),pts,hp:r>28?2:1,fl:0})}
function boom(x,y,n,c){for(let i=0;i<n;i++)par.push({x,y,vx:R(-160,160),vy:R(-160,160),l:R(.3,.7),c})}
function die(){state='over';overT=performance.now();boom(ship.x,ship.y,30,'#3fe0ff');const s=Math.floor(score);
 if(s>best){best=s;try{localStorage.setItem('best',best)}catch(e){}}}

function update(dt){
 const sp=state==='play'?speed:120;dist+=sp*dt;
 stars.forEach(s=>{s.y+=sp*s.z*.5*dt/H;if(s.y>1){s.y=0;s.x=Math.random()}});
 par.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});par=par.filter(p=>p.l>0);
 fireEl.style.setProperty('--cd',state==='play'?Math.max(0,fireT)/CD:0);
 if(state!=='play'){bul=[];return}
 speed=Math.min(1400,speed+10*dt);score+=speed*dt/20;
 const d=dir(),l=Math.hypot(d.x,d.y)||1,v=300+speed*.15;
 ship.x=Math.max(ship.r,Math.min(W-ship.r,ship.x+d.x/l*v*dt));
 ship.y=Math.max(ship.r,Math.min(H-ship.r,ship.y+d.y/l*v*dt));
 fireT-=dt;
 if((fireHeld||keys[' '])&&fireT<=0){bul.push({x:ship.x,y:ship.y-14});fireT=CD}
 bul.forEach(b=>b.y-=800*dt);
 spawnT-=dt;
 if(spawnT<=0){spawn();if(Math.random()<.25)spawn();
  spawnT=Math.max(.1,360/(speed+150))*Math.max(.4,Math.min(1.2,400/Math.max(W,300)))}
 for(const a of ast){a.y+=a.vy*dt;a.x+=a.vx*dt;a.a+=a.va*dt;a.fl-=dt;
  for(const b of bul)if(!b.d&&Math.hypot(a.x-b.x,a.y-b.y)<a.r+4){b.d=1;a.hp--;a.fl=.08;
   if(a.hp<=0){a.dead=1;score+=15;boom(a.x,a.y,14,'#ff9ef8')}}
  if(!a.dead&&Math.hypot(a.x-ship.x,a.y-ship.y)<a.r*.85+ship.r*.7)die()}
 ast=ast.filter(a=>a.y<H+80&&!a.dead);bul=bul.filter(b=>!b.d&&b.y>-20);
}

const SPR=["....w....","...cwc...","...cwc...","..ccwcc..",".mccwccm.","mmcccccmm","m.ccccc.m","..c.o.c.."],
 SC={w:'#fff',c:'#3fe0ff',m:'#ff3df2',o:'#ffb02e'};
const sn=v=>Math.round(v/S)*S;
function draw(){
 const g=lc.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07051a');g.addColorStop(1,'#1d0a42');
 lc.fillStyle=g;lc.fillRect(0,0,W,H);
 lc.fillStyle='#ff3df2';lc.globalAlpha=.18;
 for(let y=-((dist*.6)%60);y<H;y+=60)lc.fillRect(0,sn(y),W,S);
 lc.fillStyle='#3fe0ff';
 for(let i=0;i<=6;i++)lc.fillRect(sn(i*W/6),0,S,H);
 lc.globalAlpha=1;
 stars.forEach(s=>{lc.fillStyle=s.z>.7?'#fff':'#8f7bff';lc.fillRect(sn(s.x*W),sn(s.y*H),S,S*(1+(speed>500&&s.z>.5?1:0)))});
 for(const a of ast){lc.save();lc.translate(a.x,a.y);lc.rotate(a.a);lc.beginPath();
  a.pts.forEach((p,i)=>i?lc.lineTo(p[0],p[1]):lc.moveTo(p[0],p[1]));lc.closePath();
  lc.fillStyle=a.fl>0?'#fff':'#2c2556';lc.fill();lc.strokeStyle='#8f7bff';lc.lineWidth=S;lc.stroke();lc.restore()}
 lc.fillStyle='#bffcff';bul.forEach(b=>{lc.fillRect(sn(b.x)-S,sn(b.y),S,S*4);lc.fillStyle='#3fe0ff';lc.fillRect(sn(b.x)-S,sn(b.y)+S*4,S,S*2);lc.fillStyle='#bffcff'});
 if(state!=='over'){const x0=sn(ship.x)-4.5*S,y0=sn(ship.y)-4*S;
  SPR.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch!=='.'){lc.fillStyle=SC[ch];lc.fillRect(x0+i*S,y0+j*S,S,S)}}));
  const f=1+Math.floor(speed/300)+(Math.random()<.5?1:0);
  lc.fillStyle='#ffb02e';lc.fillRect(x0+4*S,y0+8*S,S,S*f);
  lc.fillStyle='#ff3df2';lc.fillRect(x0+4*S,y0+(8+f)*S,S,S)}
 par.forEach(p=>{lc.fillStyle=p.c;lc.fillRect(sn(p.x),sn(p.y),S,S)});
 ctx.imageSmoothingEnabled=false;ctx.drawImage(lo,0,0,lo.width*S,lo.height*S);
 const fs=Math.max(13,Math.min(17,W/24));
 ctx.font='bold '+fs+'px ui-monospace,Menlo,Consolas,monospace';ctx.shadowColor='#3fe0ff';ctx.shadowBlur=8;
 ctx.fillStyle='#bffcff';ctx.textAlign='left';ctx.fillText('SCORE '+String(Math.floor(score)).padStart(6,'0'),12,fs+8);
 ctx.textAlign='right';ctx.fillText(Math.round(speed*3)+' KM/S',W-12,fs+8);
 ctx.fillStyle='#ff9ef8';ctx.shadowColor='#ff3df2';ctx.fillText('HI '+String(best).padStart(6,'0'),W-12,2*fs+12);
 if(state!=='play'){
  ctx.shadowBlur=0;ctx.textAlign='center';ctx.fillStyle='rgba(7,5,26,.75)';ctx.fillRect(0,H/2-70,W,140);
  ctx.shadowBlur=12;ctx.shadowColor='#3fe0ff';ctx.fillStyle='#fff';ctx.font='bold '+Math.min(30,W/12)+'px ui-monospace,Menlo,monospace';
  ctx.fillText(state==='ready'?'CORRIDA ESPACIAL':'SISTEMA DESTRUÍDO',W/2,H/2-14);
  ctx.shadowBlur=0;ctx.font=fs+'px ui-monospace,Menlo,monospace';ctx.fillStyle='#ff9ef8';
  if(state==='over')ctx.fillText('PONTOS '+Math.floor(score),W/2,H/2+8);
  ctx.fillStyle='#9fb0ff';ctx.fillText('Toque para '+(state==='ready'?'iniciar':'reiniciar')+'',W/2,H/2+34)}
 ctx.shadowBlur=0;
}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script></body></html>
